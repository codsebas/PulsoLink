      description: Admin/viewer. Registrar patient.view una vez al abrir expediente, antes de mostrar contenido.
        viewId UUID nuevo por apertura; deduplicar por actor/paciente/viewId. Reintento idéntico devuelve 200
        con mismo eventId y duplicate:true. Polling no invoca esta operación. No modifica expediente; es la
        única mutación funcional permitida al viewer además de auth.
      x-implementation-status: planned
      x-roles:
        - admin
        - viewer
      responses:
        "200":
          description: Acceso ya registrado; duplicate:true.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - duplicate
                    properties:
                      eventId:
                        type: string
                        minLength: 1
                        maxLength: 128
                        pattern: ^[^/]+$
                      duplicate:
                        type: boolean
        "201":
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - duplicate
                    properties:
                      eventId:
                        type: string
                        minLength: 1
                        maxLength: 128
                        pattern: ^[^/]+$
                      duplicate:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[^/]+$
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - viewId
              properties:
                viewId:
                  type: string
                  format: uuid
  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: Consultar auditoría inmutable
      description: Solo admin. Orden occurredAt DESC, ID DESC. Filtros temporales sobre occurredAt. Sin endpoints de
        edición/borrado. Nunca copiar secretos ni lecturas al contexto.
      x-implementation-status: planned
      x-roles:
        - admin
      responses:
        "200":
          description: Página; from inclusivo, to exclusivo si se admiten filtros temporales.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    type: object
                    additionalProperties: false
                    required:
                      - nextCursor
                      - hasMore
                    properties:
                      nextCursor:
                        type:
                          - string
                          - "null"
                      hasMore:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Cursor opaco ligado a filtros y orden.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: Fecha ISO 8601 UTC normalizada por backend.
            pattern: Z$
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: Fecha ISO 8601 UTC normalizada por backend.
            pattern: Z$
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[^/]+$
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[^/]+$
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - role
        - enabled
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum:
            - admin
            - viewer
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - role
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        displayName:
          type: string
        role:
          type: string
          enum:
            - admin
            - viewer
    Patient:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - displayName
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        code:
          type: string
          minLength: 1
          maxLength: 32
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Alias seudónimo; no requerir datos clínicos reales.
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        updatedAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
    Device:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - source
        - enabled
        - activeSessionId
        - lastSeenAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        code:
          type: string
          minLength: 1
          maxLength: 32
        hardwareId:
          type: string
          maxLength: 128
        source:
          type: string
          enum:
            - real
            - simulated
        enabled:
          type: boolean
        activeSessionId:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        lastSeenAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
    Assignment:
      type: object
      additionalProperties: false
      required:
        - id
        - patientId
        - deviceId
        - startedAt
        - endedAt
        - assignedBy
        - endedBy
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        patientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        startedAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        endedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        assignedBy:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        endedBy:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
    Measurements:
      type: object
      additionalProperties: false
      required:
        - heartRate
        - spo2
        - skinTemperature
      properties:
        heartRate:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: number
                  maximum: 300
                  exclusiveMinimum: 0
                unit:
                  type: string
                  const: bpm
                status:
                  type: string
                  const: valid
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: "null"
                unit:
                  type: string
                  const: bpm
                status:
                  type: string
                  enum:
                    - no_contact
                    - invalid
                    - unavailable
          description: Calidad técnica independiente; no implica validez clínica. Si no es valid, value es null.
        spo2:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: number
                  maximum: 100
                  minimum: 0
                unit:
                  type: string
                  const: "%"
                status:
                  type: string
                  const: valid
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: "null"
                unit:
                  type: string
                  const: "%"
                status:
                  type: string
                  enum:
                    - no_contact
                    - invalid
                    - unavailable
          description: Calidad técnica independiente; no implica validez clínica. Si no es valid, value es null.
        skinTemperature:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: number
                  maximum: 125
                  minimum: -55
                unit:
                  type: string
                  const: C
                status:
                  type: string
                  const: valid
            - type: object
              additionalProperties: false
              required:
                - value
                - unit
                - status
              properties:
                value:
                  type: "null"
                unit:
                  type: string
                  const: C
                status:
                  type: string
                  enum:
                    - no_contact
                    - invalid
                    - unavailable
          description: Calidad técnica independiente; no implica validez clínica. Si no es valid, value es null.
    Measurement:
      type: object
      additionalProperties: false
      required:
        - id
        - patientId
        - deviceId
        - assignmentId
        - sessionId
        - receivedAt
        - capturedAt
        - bootId
        - sequence
        - measurements
        - source
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        patientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        assignmentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        receivedAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        bootId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 4294967295
        measurements:
          $ref: "#/components/schemas/Measurements"
        source:
          type: string
          enum:
            - real
            - simulated
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - patientId
        - deviceId
        - assignmentId
        - source
        - status
        - createdAt
        - startedAt
        - finishedAt
        - latestMeasurement
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        patientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        assignmentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        source:
          type: string
          enum:
            - real
            - simulated
        status:
          type: string
          enum:
            - created
            - active
            - finished
        createdAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        startedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        latestMeasurement:
          oneOf:
            - $ref: "#/components/schemas/Measurement"
            - type: "null"
    MonitoringMeta:
      type: object
      additionalProperties: false
      required:
        - serverTime
        - lastSeenAt
        - deviceOnline
        - ageMs
        - stale
        - connectionState
      properties:
        serverTime:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        lastSeenAt:
          type:
            - string
            - "null"
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        deviceOnline:
          type: boolean
        ageMs:
          type:
            - integer
            - "null"
          minimum: 0
        stale:
          type: boolean
        connectionState:
          type: string
          enum:
            - disconnected
            - connected_without_valid_reading
            - connected_with_recent_reading
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - actorId
        - action
        - targetType
        - targetId
        - occurredAt
        - result
        - context
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        actorId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^/]+$
        occurredAt:
          type: string
          format: date-time
          description: Fecha ISO 8601 UTC normalizada por backend.
          pattern: Z$
        result:
          type: string
          enum:
            - success
            - failure
        context:
          type: object
          description: Contexto mínimo definido por acción; sin secretos ni lecturas.
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pulsolink_session
      description: Sesión HttpOnly; verificar revocación, perfil habilitado y rol en cada operación. SameSite=Lax,
        Path=/, Secure en HTTPS.
  responses:
    BadRequest:
      description: "VALIDATION_ERROR: JSON, campos, filtros o cursor inválidos."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "UNAUTHENTICATED: credencial o sesión ausente, inválida o vencida."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "FORBIDDEN: rol insuficiente, usuario/dispositivo deshabilitado, CSRF u origen inválidos."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "NOT_FOUND: recurso no encontrado."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflicto de estado o idempotencia.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE: límite de cuerpo 8 KiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "RATE_LIMITED: demasiadas solicitudes; respetar Retry-After."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          description: Espera en segundos.
          schema:
            type: integer
            minimum: 1
    ServiceUnavailable:
      description: "SERVICE_UNAVAILABLE: dependencia no disponible; sin detalles internos."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
