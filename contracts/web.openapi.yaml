components:
  schemas:
    SessionSummary:
      type: object
      additionalProperties: false
      required: [sessionId, status, stats, text, generatedAt, errorCode]
      properties:
        sessionId: {type: string}
        status: {type: string, enum: [not_requested, pending, generating, ready, failed, disabled, insufficient_data]}
        stats:
          oneOf:
            - {$ref: '#/components/schemas/SessionSummaryStats'}
            - {type: 'null'}
        text: {type: [string, 'null']}
        generatedAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null'], enum: [null, PROVIDER_UNAVAILABLE, INVALID_GENERATION, SUMMARY_TOO_LARGE, CONFIGURATION_ERROR, ATTEMPTS_EXHAUSTED]}
    SessionSummaryStats:
      type: object
      additionalProperties: false
      required: [source, durationSeconds, total, metrics]
      properties:
        source: {type: string, enum: [real, simulated]}
        durationSeconds: {type: [number, 'null'], minimum: 0}
        total: {type: integer, minimum: 0}
        metrics:
          type: object
          additionalProperties: false
          required: [heartRate, spo2, skinTemperature]
          properties:
            heartRate: {$ref: '#/components/schemas/SessionSummaryMetric'}
            spo2: {$ref: '#/components/schemas/SessionSummaryMetric'}
            skinTemperature: {$ref: '#/components/schemas/SessionSummaryMetric'}
    SessionSummaryMetric:
      type: object
      additionalProperties: false
      required: [unit, validCount, mean, min, max, quality]
      properties:
        unit: {type: string, enum: [bpm, '%', C]}
        validCount: {type: integer, minimum: 0}
        mean: {type: [number, 'null']}
        min: {type: [number, 'null']}
        max: {type: [number, 'null']}
        quality:
          type: object
          additionalProperties: false
          required: [valid, no_contact, invalid, unavailable]
          properties:
            valid: {type: integer, minimum: 0}
            no_contact: {type: integer, minimum: 0}
            invalid: {type: integer, minimum: 0}
            unavailable: {type: integer, minimum: 0}
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
