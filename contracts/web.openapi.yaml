        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: postLogout
      summary: Cerrar sesión
      description: Idempotente incluso sin sesión; exige CSRF/origen. No revoca por sí solo todas las sesiones del
        usuario.
      x-implementation-status: existing-change-pending
      responses:
        "204":
          description: Sin cuerpo. Elimina cookie de sesión, rota CSRF; frontend borra caché.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      security: []
  /patients:
    get:
      operationId: listPatients
      summary: Listado paginado de patients
      description: Admin y viewer consultan pacientes/placas; solo admin consulta usuarios. Por defecto habilitados;
        filtro enabled admite deshabilitados para admin. Orden createdAt DESC/ID DESC para pacientes y
