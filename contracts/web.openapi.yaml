        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: "Código de error legible por máquina según el catálogo de la API web."
              enum:
                - VALIDATION_ERROR
                - INVALID_CURSOR
                - NO_CHANGES
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - DEVICE_DISABLED
                - FORBIDDEN
                - CSRF_INVALID
                - RESOURCE_DISABLED
                - USER_DISABLED
                - AUTH_USER_DISABLED
                - DEVICE_ID_MISMATCH
                - NOT_FOUND
                - PATIENT_NOT_FOUND
                - DEVICE_NOT_FOUND
                - SESSION_NOT_FOUND
                - ASSIGNMENT_NOT_FOUND
                - USER_NOT_FOUND
                - AUDIT_NOT_FOUND
                - USER_OPERATION_NOT_FOUND
                - ASSIGNMENT_CONFLICT
                - ASSIGNMENT_IN_USE
                - ASSIGNMENT_NOT_ACTIVE
                - INVALID_SESSION_STATE
                - IDEMPOTENCY_CONFLICT
                - SESSION_NOT_ACTIVE
                - DEVICE_BUSY
                - DEVICE_SOURCE_CHANGED
                - PROVISIONING_CONFLICT
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - TOO_MANY_ATTEMPTS
                - AUTH_UNAVAILABLE
                - AUDIT_UNAVAILABLE
                - AUTH_SYNC_PENDING
                - SERVICE_UNAVAILABLE
                - INTERNAL_SERVER_ERROR
            message:
              type: string
