        - NO_CHANGES: La solicitud de actualización no modifica los valores existentes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Autenticación requerida o fallida (401). Catálogo de códigos devueltos:
        - UNAUTHENTICATED: Sesión ausente, cookie inválida/vencida/revocada o identidad no registrada en Firestore.
        - INVALID_CREDENTIALS: Correo no registrado o contraseña incorrecta en login."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Acceso no autorizado o prohibido (403). Catálogo de códigos devueltos:
        - FORBIDDEN: Rol insuficiente (p. ej. rol viewer intentando mutaciones administrativas o consultando recursos deshabilitados) o acceso no permitido.
        - CSRF_INVALID: Token CSRF ausente o inválido, u origen no permitido (Origin/Referer no coincide con la lista autorizada).
        - RESOURCE_DISABLED: Paciente o dispositivo deshabilitados al intentar crear asignaciones o acceder a recursos protegidos.
        - USER_DISABLED / AUTH_USER_DISABLED: Perfil o cuenta de usuario deshabilitado en el sistema.
        - DEVICE_DISABLED: Placa deshabilitada durante una operación de sesión web."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "Recurso no encontrado (404). Catálogo explícito de códigos devueltos según el tipo de recurso solicitado:
        - PATIENT_NOT_FOUND: Paciente no encontrado por su identificador.
        - DEVICE_NOT_FOUND: Dispositivo o placa no encontrado por su identificador.
        - SESSION_NOT_FOUND: Sesión no encontrada por su identificador.
        - ASSIGNMENT_NOT_FOUND: Asignación no encontrada por su identificador.
        - USER_NOT_FOUND: Usuario no encontrado por su identificador.
        - AUDIT_NOT_FOUND: Registro u operación de auditoría no encontrado.
        - USER_OPERATION_NOT_FOUND: Operación de usuario pendiente no encontrada.
        - NOT_FOUND: Recurso genérico no encontrado."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "Conflicto de estado, concurrencia o idempotencia (409). Catálogo de códigos devueltos:
        - ASSIGNMENT_CONFLICT: Conflicto de asignación; paciente o placa ya asignados a otra relación activa.
        - ASSIGNMENT_IN_USE: Asignación con sesión abierta activa al intentar cerrarla, o placa/paciente en uso al intentar deshabilitarlos.
        - INVALID_SESSION_STATE: Transición de estado de sesión no permitida (p. ej. finalizar sesión created o iniciar sesión finished).
        - SUMMARY_RETRY_TOO_SOON: Esperar 60 segundos antes de reintentar un resumen PulsoAI terminal.
        - IDEMPOTENCY_CONFLICT: Clave o reintento conflictivo con carga útil o estado diferente.
        - SESSION_NOT_ACTIVE: Sesión no activa para el dispositivo o asignación.
        - ASSIGNMENT_NOT_ACTIVE: Asignación inactiva o incompatible con la sesión.
        - DEVICE_BUSY: Dispositivo ocupado con otra operación o sesión en curso.
        - DEVICE_SOURCE_CHANGED: Incompatibilidad en el origen (real/simulated) del dispositivo."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE: límite de cuerpo 8 KiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "TOO_MANY_ATTEMPTS en login o RATE_LIMITED si se limita otra ruta; respetar Retry-After."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          description: Espera en segundos.
          schema:
            type: integer
            minimum: 1
    ServiceUnavailable:
      description: "AUTH_UNAVAILABLE o AUTH_SYNC_PENDING para identidad; SERVICE_UNAVAILABLE para dependencia, sin detalles internos."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
