openapi: 3.1.0
info:
  title: "PulsoLink — Contrato B: frontend web"
  version: 2.1.0
  description: "Objetivo aprobado 18-10-2026, con implementación parcial de la API y pendiente de integración
    de interfaz, emisor y nube. Versionar documento como 2.0.0 no crea /api/v2. Roles admin|viewer: viewer solo consulta; todo
    cambio administrativo y consulta de auditoría exige admin. Excepción funcional: viewer puede registrar su
    propia apertura de expediente. Mutaciones, login y logout requieren cookie CSRF, cabecera X-CSRF-Token y
    origen permitido. Cookies HttpOnly, SameSite=Lax, Path=/, Secure en HTTPS; no localStorage. Frontend solo
    consume esta API. Fechas UTC; IDs opacos. No devolver secretos ni hashes. Prototipo académico no clínico."
servers:
  - url: http://localhost:3001/api/v1
    description: Solo desarrollo local; HTTPS con verificación del servidor en despliegue.
x-contract-status: approved-target-pending-implementation
security:
  - SessionCookie: []
paths:
  /sessions/{id}/summary:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    get:
      operationId: getSessionSummary
      summary: Consultar resumen de sesión PulsoAI
      description: Admin/viewer con acceso a la sesión. Lectura sin generación ni llamadas externas. Ver docs/arquitectura/pulsoai.md.
      x-roles: [admin, viewer]
      responses:
        '200':
          description: Estado, estadísticas y texto persistido; not_requested si no existe trabajo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SessionSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sessions/{id}/summary/retry:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    post:
      operationId: retrySessionSummary
      summary: Solicitar o reintentar resumen PulsoAI
      description: Solo admin y sesión finished. Ready/pending/generating idempotentes; demás reintentos esperan 60 s (409 SUMMARY_RETRY_TOO_SOON). No llama Groq dentro de HTTP.
      x-roles: [admin]
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202':
          description: Trabajo solicitado o estado existente; generación recuperable en servidor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SessionSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /health:
    get:
      operationId: getWebApiHealth
      summary: Salud del proceso API
      description: Endpoint público; comprueba el proceso, no conectividad con Firebase.
      x-implementation-status: existing-change-pending
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                    description: Fecha ISO 8601 UTC normalizada por backend.
                    pattern: Z$
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtener token CSRF
      description: Genera cookie pulsolink_csrf HttpOnly/SameSite=Lax/Path=/, Secure en HTTPS. No exige sesión.
      x-implementation-status: existing-change-pending
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - csrfToken
                    properties:
                      csrfToken:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
  /auth/login:
    post:
      operationId: postLogin
      summary: Iniciar sesión
      description: Verifica correo/contraseña mediante Firebase Auth, perfil habilitado y rol. Cookie/token CSRF y
        origen obligatorios. Establece pulsolink_session (TTL inicial 8 horas), rota CSRF. Audita auth.login
        con resultado, sin contraseñas/tokens. Rol viewer y auditoría pendientes.
      x-implementation-status: existing-change-pending
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthUser"
          headers:
            Set-Cookie:
              description: pulsolink_session HttpOnly; SameSite=Lax; Path=/; Secure en HTTPS. Rota pulsolink_csrf.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      security: []
  /auth/me:
    get:
      operationId: getMe
      summary: Perfil autenticado
      description: Consulta para admin y viewer.
      x-implementation-status: existing-change-pending
      x-roles:
        - admin
        - viewer
      responses:
        "200":
          description: Operación completada
